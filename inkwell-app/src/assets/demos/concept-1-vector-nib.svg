<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    
    <!-- Nib Body Gradient -->
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glowing Vector Accent Gradient -->
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad1)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <circle cx="256" cy="256" r="140" fill="none"/>
  </g>

  <!-- Vector Trace Ribbon flowing out of the Nib -->
  <path d="M 256 260 C 256 340, 360 360, 370 290 C 380 220, 290 170, 200 190 C 130 205, 120 310, 190 350 C 240 380, 320 370, 350 330" 
        fill="none" stroke="url(#glowGrad1)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Stylized Geometric Pen Nib -->
  <g filter="url(#shadow1)">
    <!-- Left Flange -->
    <path d="M 256 100 L 190 200 L 220 260 L 252 260 L 252 165 Z" fill="url(#nibGrad)"/>
    <!-- Right Flange (with lighting contrast) -->
    <path d="M 256 100 L 322 200 L 292 260 L 260 260 L 260 165 Z" fill="#e2e8f0"/>
    <!-- Nib Breather Hole -->
    <circle cx="256" cy="165" r="10" fill="#0f172a"/>
    <!-- Slit Line -->
    <line x1="256" y1="100" x2="256" y2="155" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Precision Bezier Control Handles & Anchors on the Ribbon -->
  <!-- Anchor 1 at curve crest -->
  <circle cx="370" cy="290" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
  <!-- Tangent Handle Line & Point -->
  <line x1="370" y1="290" x2="410" y2="250" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  <circle cx="410" cy="250" r="5" fill="#38bdf8"/>

  <!-- Anchor 2 -->
  <circle cx="190" cy="350" r="7" fill="#ffffff" stroke="#6366f1" stroke-width="3"/>
  <line x1="190" y1="350" x2="140" y2="340" stroke="#6366f1" stroke-width="2.5" opacity="0.8"/>
  <circle cx="140" cy="340" r="5" fill="#6366f1"/>
</svg>
