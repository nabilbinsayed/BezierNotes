<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d28"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>

    <!-- Glowing Vector Accent Gradient -->
    <linearGradient id="strokeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad4)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Construction / Grid Lines (delicate and precise) -->
  <g opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="160" y1="120" x2="340" y2="120"/>
    <line x1="160" y1="260" x2="360" y2="260"/>
    <line x1="160" y1="400" x2="360" y2="400"/>
  </g>

  <!-- Main 'B' Monogram -->
  <g filter="url(#shadow4)">
    <!-- Vertical Spine -->
    <line x1="160" y1="120" x2="160" y2="400" stroke="url(#strokeGrad4)" stroke-width="28" stroke-linecap="round"/>

    <!-- Top Bowl (Perfect cubic bezier with smooth curvature) -->
    <path d="M 160 120 C 310 120, 310 260, 160 260" 
          fill="none" stroke="url(#strokeGrad4)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Bowl (Slightly wider for optical balance) -->
    <path d="M 160 260 C 340 260, 340 400, 160 400" 
          fill="none" stroke="url(#strokeGrad4)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Precision Tangent Handles & Control Points -->
  <!-- Top Handle -->
  <line x1="160" y1="120" x2="280" y2="88" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
  <circle cx="280" cy="88" r="9" fill="url(#handleGrad)"/>
  <circle cx="280" cy="88" r="4" fill="#ffffff"/>

  <!-- Middle Dual Handle -->
  <line x1="160" y1="260" x2="320" y2="260" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
  <circle cx="320" cy="260" r="9" fill="url(#handleGrad)"/>
  <circle cx="320" cy="260" r="4" fill="#ffffff"/>

  <!-- Bottom Handle -->
  <line x1="160" y1="400" x2="295" y2="435" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
  <circle cx="295" cy="435" r="9" fill="url(#handleGrad)"/>
  <circle cx="295" cy="435" r="4" fill="#ffffff"/>

  <!-- Anchor Node Markers on Spine -->
  <circle cx="160" cy="120" r="9" fill="#ffffff" stroke="#38bdf8" stroke-width="3.5"/>
  <circle cx="160" cy="260" r="9" fill="#ffffff" stroke="#38bdf8" stroke-width="3.5"/>
  <circle cx="160" cy="400" r="9" fill="#ffffff" stroke="#38bdf8" stroke-width="3.5"/>
</svg>
