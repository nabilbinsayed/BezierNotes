<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgMono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Curve Gradient -->
    <linearGradient id="monoCurveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="monoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgMono)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Minimalist Monoline Curve and Pen Nib Composition -->
  <g filter="url(#monoGlow)">
    <!-- Fluid Smooth Bezier Ribbon -->
    <path d="M 256 220 C 256 340, 140 380, 140 280 C 140 180, 260 120, 360 200 C 440 260, 380 400, 256 400"
          fill="none" stroke="url(#monoCurveGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Geometric Pure Minimalist Nib pointing down to intersect the curve -->
    <!-- Nib Body -->
    <path d="M 256 216 L 208 120 L 230 76 L 282 76 L 304 120 Z" fill="#ffffff"/>
    <path d="M 256 216 L 256 76 L 282 76 L 304 120 Z" fill="#cbd5e1"/>
    <!-- Breather Hole -->
    <circle cx="256" cy="130" r="7" fill="#141824"/>
    <!-- Center Slit -->
    <line x1="256" y1="216" x2="256" y2="123" stroke="#141824" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Vector Control Anchors & Tangents -->
  <line x1="140" y1="280" x2="140" y2="230" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
  <circle cx="140" cy="230" r="6" fill="#38bdf8"/>
  <circle cx="140" cy="280" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>

  <line x1="360" y1="200" x2="410" y2="170" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
  <circle cx="410" cy="170" r="6" fill="#38bdf8"/>
  <circle cx="360" cy="200" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
</svg>
