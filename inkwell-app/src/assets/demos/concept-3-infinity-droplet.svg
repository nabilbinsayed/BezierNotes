<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Core Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Vector Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad3)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Orbital Bezier Loop / Ring in 3D Perspective -->
  <g transform="rotate(-25 256 256)">
    <!-- Back half of the ring -->
    <path d="M 120 256 C 120 180, 392 180, 392 256"
          fill="none" stroke="url(#ringGrad)" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Central Ink Drop / Nib Fusion -->
  <g filter="url(#shadow3)">
    <path d="M 256 112 
             C 256 112, 352 246, 352 320 
             C 352 373, 309 416, 256 416 
             C 203 416, 160 373, 160 320 
             C 160 246, 256 112, 256 112 Z" 
          fill="url(#dropGrad)"/>
    <!-- Glass Highlight on Drop -->
    <path d="M 256 142 
             C 256 142, 324 250, 324 310 
             C 324 324, 318 340, 308 352
             C 300 320, 276 270, 240 230
             C 224 212, 238 170, 256 142 Z"
          fill="rgba(255, 255, 255, 0.22)"/>
  </g>

  <!-- Front half of the ring with Bezier Anchors -->
  <g transform="rotate(-25 256 256)">
    <path d="M 392 256 C 392 332, 120 332, 120 256"
          fill="none" stroke="url(#ringGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Tangent vector bars -->
    <line x1="392" y1="256" x2="392" y2="300" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="392" cy="300" r="6" fill="#38bdf8"/>
    <circle cx="392" cy="256" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>

    <line x1="120" y1="256" x2="120" y2="212" stroke="#c084fc" stroke-width="3"/>
    <circle cx="120" cy="212" r="6" fill="#c084fc"/>
    <circle cx="120" cy="256" r="7" fill="#ffffff" stroke="#c084fc" stroke-width="3"/>
  </g>

  <!-- Central Precision Crosshair in Droplet -->
  <circle cx="256" cy="336" r="14" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
  <circle cx="256" cy="336" r="3" fill="#ffffff"/>
</svg>
